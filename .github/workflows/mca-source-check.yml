name: MCA source check

# ADR 0025 §3 — the monthly check that our stored copy of each statute still
# matches what the publisher publishes.
#
# The provenance checkers in the test suite verify that a stored copy still
# matches ITSELF, character by character. That catches our drift from the copy
# and can never catch the copy drifting from the law. This is the other half.
#
# It REPORTS and never resolves: a statute that moved is a reading task, not a
# merge, and nothing here writes to mca/sources/.
#
# It FAILS when something needs a person — a difference, a source that could not
# be fetched, or a manual source that has gone too long unconfirmed. A check
# that silently stops running is worse than no check, so a red run here is the
# intended way for that to become visible.
#
# Monthly rather than on push: statutes do not change per commit, and a check
# that runs constantly is a check nobody reads.

on:
  schedule:
    # 06:00 UTC on the first of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare stored sources with their publishers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` for `tsx` alone: the script imports the comparison rule from
      # the package where it is tested, rather than carrying its own copy.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Check each source against its publisher
        run: npx tsx scripts/mca/check-sources.ts

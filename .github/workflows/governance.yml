name: 'Governance'

# Mechanical enforcement of docs/engineering-standard.md.
#
# Every guard here targets a failure this repo has actually had — see the
# phase-1 assessment recorded in docs/STATE.md and the review checklist in
# docs/engineering-standard.md. A guard with no failure mode behind it is
# friction, and none are added on principle alone.
#
# Untrusted input (PR titles, branch names, author names) is never interpolated
# into a `run:` block; it goes through `env:` and is quoted.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"
          sed 's/^/  /' /tmp/changed.txt

      # ── Guard 1: fork discipline ────────────────────────────────────────
      # The invariant the whole architecture rests on (ADR 0002). Upstream
      # files are modified ONLY through overlays/*.patch.
      #
      # Targets the 2026-08-13 sync, which silently dropped three features
      # (admin org-delete, signing-page branding, signup flags). Nothing was
      # red; the features simply stopped existing.
      #
      # Deliberately NOT covered: .github/. Upstream owns those files too, but
      # the established convention there is an inline "MODIFIED for BizRethink"
      # marker rather than an overlay (see ci.yml, and UPSTREAM.md "When to
      # break the rules"). That is a known soft spot: workflow drift is caught
      # by review, not by this guard.
      #
      # Exempt: packages/bizrethink (ours), packages/prisma/schema.prisma
      # (generated by merge-into-schema.mjs), packages/prisma/migrations
      # (established precedent — 8 BizRethink migrations already live there),
      # and package-lock.json (npm workspaces writes our deps into upstream's
      # lockfile; see UPSTREAM.md).
      - name: Fork discipline — no unpatched upstream edits
        run: |
          UPSTREAM=$(grep -E '^(apps|packages)/' /tmp/changed.txt \
            | grep -v '^packages/bizrethink/' \
            | grep -v '^packages/prisma/schema.prisma$' \
            | grep -v '^packages/prisma/migrations/' \
            || true)

          if [ -z "$UPSTREAM" ]; then
            echo "✓ No upstream files modified."
            exit 0
          fi

          echo "Upstream files modified by this PR:"
          echo "$UPSTREAM" | sed 's/^/  /'

          if grep -q '^overlays/' /tmp/changed.txt; then
            echo "✓ overlays/ also changed — treating as a patched edit."
            echo "  Reviewer: confirm each file above is covered by a patch."
            exit 0
          fi

          echo ""
          echo "✗ Upstream files changed with no accompanying overlay."
          echo ""
          echo "  Every upstream modification goes through overlays/*.patch,"
          echo "  with a rationale and a fragility rating. See ADR 0002 and"
          echo "  UPSTREAM.md."
          echo ""
          echo "  Genuinely exceptional? Document it in overlays/EXCEPTIONS.md"
          echo "  in this same PR, which satisfies this guard."
          exit 1

      # ── Guard 2: ADRs are append-only ──────────────────────────────────
      # A decision that changes is superseded by a new ADR, never edited in
      # place. See ADR 0001.
      - name: ADRs are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MODIFIED=$(git diff --name-only --diff-filter=MD "$BASE_SHA" "$HEAD_SHA" \
            -- 'docs/adr/*.md' || true)

          if [ -z "$MODIFIED" ]; then
            echo "✓ No existing ADR modified or deleted."
            exit 0
          fi

          echo "✗ These ADRs were modified or deleted in place:"
          echo "$MODIFIED" | sed 's/^/  /'
          echo ""
          echo "  ADRs are append-only. Supersede with a new numbered ADR."
          echo "  Fixing a typo or a broken link? Say so in the PR description"
          echo "  and a human can override this check."
          exit 1

      # ── Guard 3: no legal advice in our user-facing strings ────────────
      # This platform generates and validates legal documents. A string that
      # advises rather than states is unauthorized-practice-of-law exposure —
      # see N.C. Gen. Stat. §84-2.2 and the LegalZoom line of cases.
      #
      # State the requirement and the state of the form; let the reader draw
      # the conclusion. Scoped to packages/bizrethink because upstream's own
      # copy is not ours to police.
      - name: No legal-advice language
        run: |
          # Tests are excluded on purpose: the strongest form of this rule is a
          # test asserting the phrases are ABSENT from generated output, and
          # such a test necessarily contains them. Penalising it would delete
          # the best enforcement we have. Tests are not user-facing.
          HITS=$(grep -rnEi \
            "(you should|we recommend|we suggest|is unenforceable|is illegal)" \
            packages/bizrethink --include='*.ts' --include='*.tsx' \
            | grep -v '__tests__/' \
            | grep -vE '\.test\.tsx?:' \
            | grep -v 'legal-language-ok:' \
            | grep -vE '^[^:]+:[0-9]+: *(//|\*|/\*)' \
            || true)

          if [ -z "$HITS" ]; then
            echo "✓ No advice-shaped language found."
            exit 0
          fi

          echo "✗ Advice-shaped language in user-facing strings:"
          echo "$HITS" | sed 's/^/  /'
          echo ""
          echo "  Rewrite as a statutory fact plus the state of the form:"
          echo "    'Fla. Stat. §83.595(4) caps the fee at 2 months rent"
          echo "     (\$13,800). This lease sets \$20,000.'"
          echo "  not 'you should reduce this'."
          echo ""
          echo "  Legitimate use? Append a trailing comment:"
          echo "    // legal-language-ok: <reason>"
          exit 1

      # ── Guard 4: STATE.md is kept current ──────────────────────────────
      # It is the only memory that survives between sessions, and a stale
      # STATE.md is worse than none because it is believed.
      #
      # Exempt: bot-authored PRs. The weekly upstream-sync PR is opened by a
      # GitHub Action, and failing it would turn a five-minute chore into
      # manual intervention every Monday.
      - name: STATE.md updated
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          if [ "$IS_BOT" = "true" ] || [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            echo "✓ Bot-authored PR ($PR_AUTHOR) — exempt."
            exit 0
          fi

          if grep -q '^docs/STATE.md$' /tmp/changed.txt; then
            echo "✓ docs/STATE.md updated."
            exit 0
          fi

          echo "✗ docs/STATE.md was not updated."
          echo ""
          echo "  Every session updates it last. If this PR genuinely changes"
          echo "  nothing about where things stand — a typo fix, say — add the"
          echo "  date to STATE.md and move on. That is cheaper than deciding"
          echo "  each time whether it counts."
          exit 1

  lint:
    name: Lint (bizrethink)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-install

      # Deliberately scoped to packages/bizrethink rather than the repo.
      #
      # `biome check .` fails on ~35 files today, many of them upstream files
      # our overlays touch. Reformatting those would modify upstream code
      # outside the overlay system and guarantee a conflict on every weekly
      # sync — repo-wide lint is architecturally incompatible with this fork
      # (ADR 0002). Our own code is ours to keep clean.
      #
      # Formatting is BLOCKING: mechanical, no judgment, and made green in the
      # PR that introduced this job.
      - name: Format check
        run: npx biome format packages/bizrethink

      # Lint rules are ADVISORY for now. 16 findings remain at 2026-08-29:
      # 4 useBlockStatements, 4 noUndeclaredEnvVars (a nursery rule, still
      # unstable), 4 useLiteralKeys, 3 useTemplate, 1 noImplicitAnyLet.
      #
      # Not auto-fixed, because `useLiteralKeys` wants
      # `process.env["BIZRETHINK_X"]` rewritten to `process.env.BIZRETHINK_X`,
      # and under `noPropertyAccessFromIndexSignature` that does not compile.
      # A style rule that breaks the build is not a style rule worth obeying
      # blind, and a governance PR is the wrong place to make 16 judgment
      # calls about someone else's code.
      #
      # Turn this blocking once the 16 are worked through deliberately.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          npx biome lint packages/bizrethink || true
          echo ""
          echo "──────────────────────────────────────────────────────────"
          echo "Advisory. Baseline at 2026-08-29: 16 lint findings."
          echo "See the comment in governance.yml before auto-fixing."
          echo "──────────────────────────────────────────────────────────"

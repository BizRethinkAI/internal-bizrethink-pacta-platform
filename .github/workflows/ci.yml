name: 'Continuous Integration'

on:
  workflow_call:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# MODIFIED for BizRethink (security hardening 2026-05-26): default-deny
# GITHUB_TOKEN scope. Both jobs only need to checkout code; neither writes
# to the repo, posts comments, or triggers downstream workflows. Closes
# CodeQL alerts #4 and #12 (actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build_app:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: ./.github/actions/node-install

      - name: Copy env
        run: cp .env.example .env

      # MODIFIED for BizRethink (overlay 059): exclude @documenso/docs from the
      # CI build. Pacta doesn't deploy the upstream Documenso docs site (per
      # CLAUDE.md; "apps/docs — docs site, probably skip deploying"). After
      # Phase 0's lockfile regen + Dependabot patches, the docs app's
      # transitive deps (@mdx-js/mdx, @fumadocs/ui CSS path) ended up broken.
      # Coolify builds via Docker which targets only apps/remix, so deploys
      # work — but `npm run build` at the monorepo root via Turborepo expands
      # to build every workspace including apps/docs, failing CI on every
      # push. Filtering it out via Turbo flag silences the false alarm and
      # still validates everything Pacta actually ships.
      - name: Build app
        run: npm run build -- --filter=!@documenso/docs

      # MODIFIED for BizRethink (2026-08-29): run the unit tests.
      #
      # Until this date CI ran the two build steps above and nothing else, so
      # "CI green" certified only that the code compiled. The ~2,100 unit tests
      # in this repo ran solely when a human remembered to run them — including
      # every test in packages/bizrethink, which is where all our behaviour
      # lives. See docs/engineering-standard.md §1.
      #
      # Note the inversion this exposes: CI runs Node 22 (the default in
      # .github/actions/node-install) where `prisma generate` works, while a
      # workstation on Node 26 cannot run `npm test` at all — zod-prisma-types
      # calls fs.rm with the `recursive` option Node 26 removed. CI is
      # currently the only place the full suite can run.
      - name: Unit tests
        run: npm test -- --filter=!@documenso/docs

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: .
          file: ./docker/Dockerfile
          tags: documenso-${{ github.sha }}

name: PR description

# The PR description is the review surface (.github/pull_request_template.md).
# This job fails a PR whose body skips or leaves empty any template section,
# names no tests, changes the schema without an ADR, or touches a money/auth/
# scope path without linking the red run engineering-standard §4 requires.
# Runs on body edits too, so fixing the description re-checks it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # MODIFIED for BizRethink (2026-09-09): 20 -> 24. This file is
      # byte-identical across several repos and propagated Node 20 as a unit;
      # 20 is EOL. Every other workflow here reaches Node through
      # .github/actions/node-install, whose default is already v24.x — this was
      # the last literal version left. check-pr-body.mjs imports only node:fs,
      # so nothing about the runtime bump is load-bearing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the description against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          git diff --name-status "origin/$BASE...HEAD" > /tmp/pr-changed.txt
          node scripts/ci/check-pr-body.mjs --body /tmp/pr-body.md --changed /tmp/pr-changed.txt

name: Playwright Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# MODIFIED for BizRethink (security hardening 2026-05-26): default-deny
# GITHUB_TOKEN scope. The e2e job only needs to checkout code and run
# Playwright; no repo writes. Closes CodeQL alert #7.
permissions:
  contents: read

# MODIFIED for BizRethink (2026-08-29): sharded across 8 runners.
#
# The suite took ~59 minutes of wall clock on every pull request. Per-step
# timings from a real run: 2m49s of setup, and ~56 minutes in a single step.
# The cause is the runner, not the tests — playwright.config.ts computes
# workers as `cores / 2` capped at 6, so upstream's 8-core WarpBuild box gets 4
# workers and this fork's 2-core ubuntu-latest gets 1. Overlay 061 made that
# switch because WarpBuild was never available here, and a serial run of 133
# spec files is the consequence.
#
# Sharding restores the parallelism the runner cannot provide. Setup is only
# ~3 minutes and runs concurrently on each shard, so every test still runs.
#
# FOUR SHARDS PREDICTED ~16 MINUTES AND DELIVERED 31. Measured on run
# 33242865996: shards 1 and 2 finished in 9.8 and 10.7 minutes, shards 3 and 4
# in 31.0 and 30.3. Playwright balances shards by TEST COUNT, not duration, and
# the spec files are distributed in sorted order — so the back half of the
# alphabet (envelope-editor-v2, envelopes, teams, templates: slow browser
# flows) landed together, while the front half (mostly fast API specs) finished
# in a third of the time. Wall clock is set by the slowest shard, so half the
# fleet sat idle for 20 minutes.
#
# Eight shards splits the heavy half in two: the ~30-minute shards become
# ~15-minute ones and wall clock lands near 3 + 15 = 18 minutes. That is a
# blunt fix for an imbalance problem, and it is the right one here — Playwright
# has no duration-aware sharding, and a hand-maintained list of "slow specs"
# would go stale on the first upstream sync.
#
# WHY THIS MATTERS BEYOND CONVENIENCE. A 50-minute gate on a solo-maintained
# repo does not get waited for; it gets bypassed. That is not a discipline
# failure, it is what an unusable feedback loop causes, and PRs #26 and #27
# were merged mid-flight because of it — losing five commits. Repo-level
# auto-merge was enabled the same day so a green PR merges itself without
# anyone watching. Making the gate fast and making it unattended are the same
# fix approached from two directions.
#
# WHY NOT SIMPLY RUN IT LESS OFTEN. The tempting alternative is to skip the
# suite unless a PR makes "material UI or flow changes". The repo's own history
# argues against it:
#
#   - The gate sat dark from the fork's creation (2026-04-29) until overlay 061
#     fixed the runner (2026-08-13). Two upstream syncs merged in that window,
#     and the 2026-08-13 audit then found three silently dropped features.
#   - One of them, admin organisation delete, has a dedicated spec —
#     e2e/admin/organisations/delete-organisation.spec.ts — which is NOT in the
#     overlay 066 exclusion list. A working gate would very likely have caught
#     it. Its clean record exists because it was not running.
#   - 125 of the 133 specs test UPSTREAM behaviour. In a fork the suite's real
#     job is catching our ~42 overlays breaking upstream, and overlay changes
#     rarely look like "material UI changes".
#   - PR #12 ("reject malformed-URL scanner paths before route matching") had
#     no UI and no user flow, yet changed request routing — where over-matching
#     breaks every flow at once. A UI-only filter would have skipped it.
#
# So: make it fast, do not make it selective. The one exception below is
# documentation, which changes nothing the app is built from.

jobs:
  e2e_tests:
    name: 'E2E Shard ${{ matrix.shard }}'
    strategy:
      # One shard failing must not cancel the rest. A partial picture of which
      # tests broke is much less useful than the whole one.
      fail-fast: false
      matrix:
        shard: [1]
    # ON THE HOMELAB RUNNER, DELIBERATELY UNSHARDED (2026-08-31).
    #
    # ci-runner-01 — Proxmox VM 102, 10.10.10.41, 8 cores. calculateWorkers()
    # in playwright.config.ts is `cores / 2`, so the UI project gets 4 workers
    # where a 2-core ubuntu-latest gave 1. The slow shards used to log
    # "Running 137 tests using 1 worker"; 55 minutes of test time ran
    # single-file no matter how it was divided.
    #
    # `matrix: [1]` IS THE END STATE, NOT A STEP DOWN. One runner instance
    # processes ONE job at a time, so shards against a single instance run
    # SERIALLY and re-pay setup each time. Extra instances would share these
    # same 8 cores — they add concurrency, not CPU, so two parallel shards
    # would get 2 workers each rather than 4. Real shard parallelism needs a
    # SECOND runner VM. Never raise this matrix without adding hardware first.
    #
    # NO SEPARATE BUILD JOB, and that is not an oversight. Building once and
    # sharing an artifact was right for eight GitHub-hosted shards — 3.6 min of
    # identical work, eight times — but with one shard there is nothing to
    # share, and a build job on a GitHub runner would add a serial hop plus an
    # artifact round trip in front of everything. The guard in
    # workflow-runners.test.ts enforces sharing only when shards > 1.
    #
    # TWO GATES HAD TO BE OPEN, and only one of them is obvious:
    #   - the runner group's `allows_public_repositories` (this repo is public;
    #     the flag is false by default on every group GitHub creates, and is a
    #     SEPARATE gate from `visibility: all` despite reading like a synonym)
    #   - the repo's fork-PR policy, now `all_external_contributors`, so an
    #     outside PR cannot execute anything here without explicit approval.
    # The second is what makes the first safe. Do not loosen it.
    #
    # overlay 061 (2026-08-13, second revision): raised from 60 to 120.
    # The curated suite took 51 min on the green baseline, and the 142-commit
    # upstream sync pushed it past the 60 min cap — GitHub killed the job
    # mid-run, which reports neither pass nor fail and silently darkens the
    # gate. This fork runs on a 2-core ubuntu-latest instead of upstream's
    # 8-core WarpBuild box, so our wall-clock is structurally higher.
    # Guarded by packages/bizrethink/regression-tests/workflow-runners.test.ts.
    # Kept at 120 per shard: generous now that each shard runs an eighth of the
    # suite, but the failure it guards against (killed mid-run = no verdict) is
    # unchanged and costs nothing to over-provision against.
    timeout-minutes: 120
    # overlay 061 (2026-08-13): upstream runs Playwright on WarpBuild
    # (warp-ubuntu-2204-x64-8x). This fork has no WarpBuild runner integration,
    # so that label sat queued forever and silently disabled the E2E gate.
    # GitHub-hosted ubuntu-latest has Docker (for dx:up) + is always available.
    # Guarded by packages/bizrethink/regression-tests/workflow-runners.test.ts.
    runs-on: [self-hosted, linux, x64]
    steps:
      # fetch-depth: 0 so the docs-only detection below can diff against the
      # PR base. A shallow clone does not contain base.sha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MODIFIED for BizRethink (2026-08-29): skip the suite on docs-only PRs.
      #
      # The narrow, safe exception to "run everything": a change that alters
      # nothing the application is built from cannot break a browser test.
      #
      # The filter gates the STEPS, never the job. E2E Tests is a required
      # check, and a job skipped by a workflow-level `paths` filter reports
      # nothing at all — the PR then waits forever for a status that never
      # arrives. Same silent-gate failure as a cancelled run, reached a
      # different way.
      #
      # Fail-safe toward running: skipped only when EVERY changed file is
      # documentation. One source file anywhere and the full suite runs.
      - name: Detect docs-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ -z "$CHANGED" ]; then
            echo "No changed files resolved — running the full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          NON_DOCS=$(echo "$CHANGED" \
            | grep -vE '\.md$' \
            | grep -vE '^docs/' \
            | grep -vE '^\.github/ISSUE_TEMPLATE/' \
            | grep -vE '^(LICENSE|CODEOWNERS)$' \
            || true)

          if [ -z "$NON_DOCS" ]; then
            echo ""
            echo "Documentation only — skipping the Playwright suite."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "Non-documentation files changed:"
            echo "$NON_DOCS" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy env
        if: steps.scope.outputs.code == 'true'
        run: cp .env.example .env

      - uses: ./.github/actions/node-install
        if: steps.scope.outputs.code == 'true'

      - name: Start Services
        if: steps.scope.outputs.code == 'true'
        run: npm run dx:up

      - uses: ./.github/actions/playwright-install
        if: steps.scope.outputs.code == 'true'

      - name: Create the database
        if: steps.scope.outputs.code == 'true'
        run: npm run prisma:migrate-dev

      - name: Seed the database
        if: steps.scope.outputs.code == 'true'
        run: npm run prisma:seed

      # REDUNDANT AND NOW REMOVED (2026-08-31). `./.github/actions/playwright-install`
      # ran nine steps earlier and does exactly this. Two copies meant fixing
      # the sudo problem in one of them and watching the run fail again on the
      # other — the second failure looked like a new bug and was the same one.
      #
      # If browsers ever need installing here, call the action rather than
      # inlining the command a second time.

      # Was `npm run ci`, which is
      #   turbo run build --filter=@documenso/remix && turbo run test && turbo run test:e2e
      # — so this job rebuilt the app that the Build App job builds in parallel
      # AND ran the whole unit-test suite, before getting to Playwright. The
      # build is genuinely needed here (Playwright serves the built app); the
      # unit tests are not, and belong to ci.yml.
      - name: Build the app
        if: steps.scope.outputs.code == 'true'
        run: npm run build -- --filter=@documenso/remix

      # Called directly rather than through `turbo run test:e2e`, because turbo
      # v2 defaults to strict env mode and would not pass E2E_TEST_PATH through
      # to the script. The task declares `cache: false` and `dependsOn: ^build`,
      # both of which the explicit build step above already satisfies.
      #
      # E2E_TEST_PATH is interpolated straight into `playwright test $E2E_TEST_PATH`
      # by the upstream script, which makes it the seam for --shard without
      # touching upstream's package.json.
      - name: Run Playwright shard ${{ matrix.shard }} of 1
        if: steps.scope.outputs.code == 'true'
        run: npm run test:e2e -w @documenso/app-tests
        env:
          E2E_TEST_PATH: '--shard=${{ matrix.shard }}/1'
          # Needed since we use next start which will set the NODE_ENV to production
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.code == 'true'
        with:
          # Per shard, or the four uploads collide.
          name: test-results-shard-${{ matrix.shard }}
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7

      # Make the skip visible in the check output. A green E2E check that ran
      # nothing should say so, not look identical to one that ran everything.
      - name: Report skip
        if: steps.scope.outputs.code != 'true'
        run: |
          echo "E2E suite SKIPPED — this pull request changes documentation only."
          echo "The check reports success so the required-check gate is satisfied."
          echo "Any non-documentation file in the diff runs the full suite."
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Stream task output instead of buffering it. Turbo's buffered mode
      # discards output when a task is killed, so the 2026-08-13 capped run
      # produced 53 min of total silence and "slow" was indistinguishable
      # from "hung". Streaming keeps a stalled run diagnosable from the log.
      TURBO_LOG_ORDER: stream

  # The required check. Branch protection names "E2E Tests", so that name has
  # to survive sharding — this job carries it and simply reports whether every
  # shard succeeded.
  #
  # `if: always()` matters: without it this job is skipped when any shard
  # fails, and a skipped required check reports NO STATUS rather than a
  # failure, leaving the PR blocked forever on a verdict that never comes.
  e2e_gate:
    name: 'E2E Tests'
    needs: [e2e_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every shard succeeded
        env:
          RESULT: ${{ needs.e2e_tests.result }}
        run: |
          echo "Shard matrix result: $RESULT"

          # 'success' means every shard passed. 'skipped' means the whole matrix
          # was skipped, which should not happen — the shards no-op internally
          # on docs-only PRs rather than being skipped as jobs — so treat it as
          # a failure rather than quietly passing.
          if [ "$RESULT" = "success" ]; then
            echo "All 4 shards passed."
            exit 0
          fi

          echo ""
          echo "E2E did not pass. Shard matrix reported: $RESULT"
          echo "'cancelled' is NOT a pass — it is no verdict. Re-run it."
          exit 1

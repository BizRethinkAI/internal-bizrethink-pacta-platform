# MODIFIED for BizRethink: separate records for concurrent session assignments.
name: Session task
description: Assign one approved piece of work to one session.
title: '[Task] '
body:
  - type: markdown
    attributes:
      value: |
        Use role labels and unique session labels, not personal names or local
        identifying details. The coordinator owns assignments and reservations.
        The session responsible for the current step updates the PR link, Status
        and Next action, and adds evidence in comments. Re-read before editing;
        preserve assignment fields and other sessions' updates. The session
        finishing the last required step sets Done, records no remaining action
        and closes the task as completed. A merged PR alone may leave required
        work pending. Read other open cards before assigning overlapping work.
  - type: textarea
    id: outcome
    attributes:
      label: Approved outcome and scope
      description: Include approval context, affected areas and completion criteria, including any required review, merge, consolidation, installation or authorized shipping.
    validations:
      required: true
  - type: input
    id: coordinator
    attributes:
      label: Coordinator and authority
      placeholder: Repository owner, or the one explicitly appointed coordinator session
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owning session
      description: Use a unique session label; a shared GitHub account is insufficient.
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch and PR
      placeholder: Unique branch; add PR URL when opened
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and reservations
      description: Related task/PR links, overlapping files, overlay or migration identifiers; write None if absent.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Keep the body current at each handoff; Done requires all approved completion criteria and closing the issue.
      options:
        - Queued
        - Assigned
        - Implementing
        - Review
        - Blocked
        - Merged awaiting shipping
        - Done
      default: 0
    validations:
      required: true
  - type: textarea
    id: next-action
    attributes:
      label: Next action and responsible session
      description: Record the next already-authorized role and required action. On completion use None — approved scope complete, record evidence and close the issue. A merge is not a deployment.
    validations:
      required: true
